<div
  class="py-6 w-full bg-white rounded-sm flex flex-col"
  *transloco="let t; read: 'resumes'"
>
  <button
    class="mb-4 self-start bg-primary app-primary"
    (click)="handleBack()"
  >
    <i class="fas fa-chevron-left mr-1 text-white"></i>
    {{ t("form.back") }}
  </button>

  <h2 class="text-2xl pb-2 font-bold text-primary">
    {{ t("form.createTitle") }}
  </h2>

  <app-resumes-form
    [isLoading]="isLoading"
    (onSubmit)="onSubmit($event)"
  ></app-resumes-form>

  <app-generic-error
    *ngIf="hasError"
    [message]="errorMessage"
  ></app-generic-error>
</div>
