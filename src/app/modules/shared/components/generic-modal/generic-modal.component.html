<!-- Modal Backdrop -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
  (click)="onBackdropClick()"
>
  <!-- Modal Container -->
  <div
    class="bg-white rounded-lg shadow-lg w-full mx-4 {{ getSizeClass() }}"
    (click)="onModalClick($event)"
  >
    <!-- Modal Header -->
    <div
      class="flex items-center justify-between p-6 border-b border-gray-200"
      *ngIf="modalConfig.title || modalConfig.showCloseButton"
    >
      <h3 class="text-lg font-semibold text-gray-900" *ngIf="modalConfig.title">
        {{ modalConfig.title }}
      </h3>
      <button
        *ngIf="modalConfig.showCloseButton"
        type="button"
        class="text-gray-400 hover:text-gray-600 focus:outline-none"
        (click)="close()"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-6">
      <ng-content></ng-content>
    </div>

    <!-- Modal Footer -->
    <div
      class="flex items-center justify-end gap-3 p-6 border-t border-gray-200"
      *ngIf="modalConfig.showFooter"
    >
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 {{
          modalConfig.cancelButtonClass
        }}"
        (click)="cancel()"
      >
        {{ modalConfig.cancelText }}
      </button>
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 {{
          modalConfig.confirmButtonClass
        }}"
        (click)="confirm()"
      >
        {{ modalConfig.confirmText }}
      </button>
    </div>
  </div>
</div>
