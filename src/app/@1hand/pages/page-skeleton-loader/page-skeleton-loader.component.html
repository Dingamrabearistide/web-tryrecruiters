<div class="animate-pulse flex flex-col lg:flex-row gap-4 lg:gap-6 p-4 lg:p-8">
  <!-- Sidebar Skeleton -->
  <div *ngIf="showSidebar" class="w-full lg:w-80 lg:flex-shrink-0">
    <div
      class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 lg:p-6"
    >
      <!-- Sidebar Title -->
      <div class="h-6 bg-gray-200 rounded w-32 mb-4 lg:mb-6"></div>

      <!-- Filter Section 1 -->
      <div class="mb-4 lg:mb-6">
        <div class="h-5 bg-gray-200 rounded w-3/5 sm:w-40 mb-3"></div>
        <div class="space-y-2">
          <div class="h-8 bg-gray-200 rounded w-full"></div>
        </div>
      </div>

      <!-- Filter Section 2 -->
      <div class="mb-4 lg:mb-6">
        <div class="h-5 bg-gray-200 rounded w-2/5 sm:w-36 mb-3"></div>
        <div class="space-y-2">
          <div class="h-8 bg-gray-200 rounded w-full"></div>
        </div>
      </div>

      <!-- Filter Section 3 -->
      <div class="mb-4 lg:mb-6">
        <div class="h-5 bg-gray-200 rounded w-3/4 sm:w-44 mb-3"></div>
        <div class="space-y-2">
          <div class="h-8 bg-gray-200 rounded w-full"></div>
        </div>
      </div>

      <!-- Filter Section 4 -->
      <div class="mb-4 lg:mb-6">
        <div class="h-5 bg-gray-200 rounded w-2/5 sm:w-32 mb-3"></div>
        <div class="space-y-2">
          <div class="flex gap-2">
            <div class="h-8 bg-gray-200 rounded flex-1"></div>
            <div class="h-8 bg-gray-200 rounded flex-1"></div>
          </div>
        </div>
      </div>

      <!-- Filter Section 5 -->
      <div class="mb-4 lg:mb-6">
        <div class="h-5 bg-gray-200 rounded w-3/5 sm:w-40 mb-3"></div>
        <div class="space-y-2">
          <div class="flex gap-2">
            <div class="h-8 bg-gray-200 rounded flex-1"></div>
            <div class="h-8 bg-gray-200 rounded flex-1"></div>
          </div>
        </div>
      </div>

      <!-- Reset Button -->
      <div class="h-10 bg-gray-200 rounded w-full"></div>
    </div>
  </div>

  <!-- Main Content Skeleton -->
  <div class="flex-1 min-w-0">
    <!-- Header Skeleton -->
    <div
      class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 sm:p-6 mb-4 sm:mb-6"
    >
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4"
      >
        <div class="flex flex-col flex-1 w-full md:w-auto">
          <div
            class="h-6 bg-gray-200 rounded w-full max-w-[12rem] sm:w-48 mb-2"
          ></div>
          <div
            class="h-4 bg-gray-200 rounded w-full max-w-[18rem] sm:w-80"
          ></div>
        </div>
        <div class="flex items-center gap-2 sm:gap-4 w-full md:w-auto">
          <div
            class="h-10 bg-gray-200 rounded flex-1 sm:flex-none sm:w-32"
          ></div>
          <div class="h-10 bg-gray-200 rounded w-20 sm:w-24"></div>
        </div>
      </div>
    </div>

    <!-- Pagination Skeleton -->
    <div
      class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 sm:gap-0 mb-4 sm:mb-6"
    >
      <div class="h-4 bg-gray-200 rounded w-28 sm:w-32"></div>
      <div class="h-10 bg-gray-200 rounded w-full sm:w-64"></div>
    </div>

    <!-- Grid/List Skeleton -->
    <div
      [ngClass]="
        displayMode === 'grid'
          ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-4 sm:gap-6'
          : 'space-y-4'
      "
    >
      <!-- Skeleton Cards -->
      <div
        *ngFor="let item of skeletonArray"
        class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 sm:p-6"
      >
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
          <!-- Company Logo Skeleton -->
          <div
            class="w-12 h-12 sm:w-16 sm:h-16 bg-gray-200 rounded-lg flex-shrink-0"
          ></div>

          <div class="flex-1 min-w-0">
            <!-- Job Title -->
            <div
              class="h-5 bg-gray-200 rounded w-full sm:w-3/4 mb-2 sm:mb-3"
            ></div>

            <!-- Company Name -->
            <div
              class="h-4 bg-gray-200 rounded w-3/4 sm:w-1/2 mb-3 sm:mb-4"
            ></div>

            <!-- Job Details (Location, Type, Salary) -->
            <div class="flex flex-wrap gap-2 mb-3 sm:mb-4">
              <div class="h-6 bg-gray-200 rounded w-20 sm:w-24"></div>
              <div class="h-6 bg-gray-200 rounded w-16 sm:w-20"></div>
              <div class="h-6 bg-gray-200 rounded w-24 sm:w-28"></div>
            </div>

            <!-- Tags -->
            <div class="flex flex-wrap gap-2 mb-3 sm:mb-4">
              <div class="h-6 bg-gray-200 rounded w-14 sm:w-16"></div>
              <div class="h-6 bg-gray-200 rounded w-16 sm:w-20"></div>
              <div class="h-6 bg-gray-200 rounded w-20 sm:w-24"></div>
            </div>

            <!-- Footer (Date & Bookmark) -->
            <div class="flex justify-between items-center">
              <div class="h-4 bg-gray-200 rounded w-28 sm:w-32"></div>
              <div class="h-8 w-8 bg-gray-200 rounded"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Pagination Skeleton -->
    <div class="flex justify-center mt-6 sm:mt-8">
      <div class="h-10 bg-gray-200 rounded w-full max-w-xs sm:w-64"></div>
    </div>
  </div>
</div>
