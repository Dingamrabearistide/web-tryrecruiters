<!-- 1. badge type -->
<ng-container
  *ngIf="column.type === 'badge' && column.badgeConfig; else checkRender"
>
  <app-status-badge
    [status]="column.badgeConfig(item).status"
    [config]="column.badgeConfig(item).config || {}"
    [showDot]="column.badgeConfig(item).showDot !== false"
    [defaultLabel]="column.badgeConfig(item).defaultLabel || 'Inconnu'"
  ></app-status-badge>
</ng-container>

<!-- 2. render (composant dynamique) -->
<ng-template #checkRender>
  <ng-container *ngIf="column.render; else checkTemplate">
    <ng-container
      *ngComponentOutlet="column.render; injector: createInjector()"
    />
  </ng-container>
</ng-template>

<!-- 2. template personnalisé -->
<ng-template #checkTemplate>
  <ng-container *ngIf="column.template; else checkList">
    <ng-container
      *ngTemplateOutlet="column.template; context: { $implicit: item }"
    ></ng-container>
  </ng-container>
</ng-template>

<!-- 3. renderList -->
<ng-template #checkList>
  <ng-container *ngIf="column.renderList; else checkRenderValue">
    <ul class="list-disc list-inside text-gray-800 gap-1">
      <li *ngFor="let val of column.renderList(item)">
        {{ val | transloco }}
      </li>
    </ul>
  </ng-container>
</ng-template>

<!-- 4. renderValue -->
<ng-template #checkRenderValue>
  <ng-container *ngIf="column.renderValue; else checkKey">
    <a *ngIf="isUrl(column.renderValue(item)); else plainText" [href]="column.renderValue(item)" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700 hover:bg-blue-100 transition no-underline">
      <i class="fa-solid fa-video text-[10px]"></i>
      {{ column.linkLabel || 'Open Link' }}
    </a>
    <ng-template #plainText>
      {{ column.renderValue(item) }}
    </ng-template>
  </ng-container>
</ng-template>

<!-- 5. key fallback -->
<ng-template #checkKey>
  <ng-container *ngIf="column.key as key; else defaultActions">
    {{ item?.[key] }}
  </ng-container>
</ng-template>

    <app-generic-datatable-actions-cell
      [item]="item"
      [canView]="column.canView"
      [canEdit]="column.canEdit"
      [canDelete]="column.canDelete"
      [currentStatus]="currentStatus"
      [enableRecruiterPlanActions]="enableRecruiterPlanActions"
      (view)="view.emit($event)"
      (edit)="edit.emit($event)"
      (delete)="delete.emit($event)"
      (approve)="approve.emit($event)"
      (reject)="reject.emit($event)"
      (revoke)="revoke.emit($event)"
      (republish)="republish.emit($event)"
      (submit)="submit.emit($event)"
      (assignUnlimited)="assignUnlimited.emit($event)"
      (deactivatePlans)="deactivatePlans.emit($event)"
    />
  </ng-container>
</ng-template>
