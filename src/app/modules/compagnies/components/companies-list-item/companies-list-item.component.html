<div
  *transloco="let t; read: 'companies'"
  class="bg-white border border-gray-200 rounded-xl w-full flex flex-col hover:bg-blue-50 hover:border-blue-200 transition duration-300 overflow-hidden"
>
  <!-- Skeleton -->
  <ng-container *ngIf="!layoutReady">
    <div class="h-36 w-full bg-gray-200 animate-pulse"></div>
    <div class="p-4 flex flex-col gap-3 flex-1">
      <div class="h-4 bg-gray-200 rounded animate-pulse w-2/3"></div>
      <div class="h-3 bg-gray-100 rounded animate-pulse w-full"></div>
      <div class="h-3 bg-gray-100 rounded animate-pulse w-4/5"></div>
      <div class="h-3 bg-gray-100 rounded animate-pulse w-1/2"></div>
      <div class="mt-auto pt-3 border-t border-gray-100 flex justify-between">
        <div class="h-6 bg-gray-100 rounded-full animate-pulse w-20"></div>
        <div class="h-8 bg-gray-200 rounded animate-pulse w-24"></div>
      </div>
    </div>
  </ng-container>

  <!-- Contenu réel -->
  <ng-container *ngIf="layoutReady">
    <!-- Logo -->
    <app-image-preview
      [src]="item.logoFile?.url || item.logoUrl || '/images/no-image.jpg'"
      [alt]="item.name + ' logo'"
      class="h-36 w-full object-cover flex-shrink-0"
    />

    <div class="p-4 flex flex-col gap-2 flex-1">
      <!-- Nom -->
      <h3 class="font-semibold text-base text-gray-800 leading-tight">
        {{ item.name }}
      </h3>

      <!-- Description -->
      <div
        *ngIf="item.description"
        #descriptionRef
        [innerHTML]="item.description"
        class="text-sm text-gray-500 leading-relaxed"
        [ngClass]="isDescriptionShort ? 'line-clamp-1' : 'line-clamp-3'"
      ></div>

      <div class="flex flex-col gap-1.5 mt-1">
        <!-- Ville -->
        <div class="text-sm text-gray-600 flex items-center gap-2">
          <i class="fa fa-map-marker-alt text-[#1D9BED] w-3.5 text-center"></i>
          <span class="truncate">
            {{ item.city }}
            <span *ngIf="item.region">, {{ item.region }}</span>
            <span *ngIf="item.country">, {{ item.country }}</span>
          </span>
        </div>

        <!-- Téléphone -->
        <div
          *ngIf="item.phoneNumber"
          class="text-sm text-gray-600 flex items-center gap-2"
        >
          <i class="fa fa-phone text-[#1D9BED] w-3.5 text-center"></i>
          <span class="truncate">{{ item.phoneNumber }}</span>
        </div>

        <!-- Email -->
        <div
          *ngIf="item.email"
          class="text-sm text-gray-600 flex items-center gap-2"
        >
          <i class="fa fa-envelope text-[#1D9BED] w-3.5 text-center"></i>
          <span class="truncate">{{ item.email }}</span>
        </div>

        <!-- Site web -->
        <div *ngIf="item.website" class="text-sm flex items-center gap-2">
          <i class="fa fa-globe text-[#1D9BED] w-3.5 text-center"></i>

          <a
            [href]="item.website"
            target="_blank"
            class="text-blue-600 hover:underline truncate"
            >{{ item.website }}</a
          >
        </div>

        <!-- Adresse -->
        <div
          *ngIf="item.addressLine1 || item.addressLine2"
          class="text-sm text-gray-600 flex items-center gap-2"
        >
          <i class="fa fa-map text-[#1D9BED] w-3.5 text-center"></i>
          <span class="truncate">
            {{ item.addressLine1 }}
            <span *ngIf="item.addressLine2">, {{ item.addressLine2 }}</span>
          </span>
        </div>
      </div>

      <!-- Footer -->
      <div
        class="flex items-center justify-between mt-auto pt-3 border-t border-gray-100"
      >
        <span
          class="inline-flex items-center gap-1.5 text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-100 px-2.5 py-1 rounded-full"
        >
          <i class="fa-solid fa-briefcase text-[10px]"></i>
          {{ item.jobOffers?.length || 0 }} {{ t("offers") }}
        </span>
        <button (click)="onView(item)" class="app-primary text-sm px-3 py-1.5">
          {{ t("item.details") }}
        </button>
      </div>
    </div>
  </ng-container>
</div>
