<button class="app-primary" (click)="openModal()">
  <span class="text-white">{{ "joboffers.jobDetails.apply" | transloco }}</span>
</button>

<ng-template #form>
  <div class="lg:w-[720px] w-full">
    <!-- Message d'information si aucun CV n'est disponible -->
    <div
      *ngIf="!resumes || resumes.length === 0"
      class="mb-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg"
    >
      <div class="flex items-center">
        <i class="fas fa-exclamation-triangle text-yellow-600 mr-2"></i>
        <p class="text-sm text-yellow-800">
          {{ "applications.form.noResumeAvailable" | transloco }}
        </p>
      </div>
      <p class="text-xs text-yellow-700 mt-1">
        {{ "applications.form.uploadResumeFirst" | transloco }}
      </p>
    </div>

    <!-- Lien vers la gestion des CV si aucun CV disponible -->
    <div *ngIf="!resumes || resumes.length === 0" class="mb-4">
      <button
        type="button"
        (click)="navigateToResumes()"
        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
      >
        <i class="fas fa-upload mr-2"></i>
        {{ "applications.form.manageResumes" | transloco }}
      </button>
    </div>

    <!-- Formulaire de candidature -->
    <div *ngIf="resumes && resumes.length > 0">
      <app-generic-form
        #genericForm
        [defaultValues]="defaultValues"
        [fieldConfigurations]="formConfig"
        [isLoading]="isLoading"
        [showActionButton]="false"
        transationNamespace="applications"
        (submitForm)="onSubmit($event)"
      />
    </div>

    <app-generic-error
      *ngIf="hasError"
      [message]="errorMessage"
    ></app-generic-error>
  </div>
</ng-template>
