<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TryRecruiters — Company Form</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Condensed:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      referrerpolicy="no-referrer"
    />

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: "#07152f",
              ink: "#241449",
              blue: "#149df2",
              blue2: "#0b79d0",
              skysoft: "#eaf6ff",
              coral: "#ff5148",
              mist: "#f4f7fa",
              line: "#e5edf5",
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui"],
              display: ["Roboto Condensed", "Inter", "ui-sans-serif"],
            },
            boxShadow: {
              soft: "0 18px 45px rgba(7, 21, 47, .10)",
              card: "0 10px 30px rgba(15, 23, 42, .08)",
              glow: "0 18px 60px rgba(20, 157, 242, .25)",
            },
          },
        },
      };
    </script>

    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
      }
      .dashboard-bg {
        background-image:
          radial-gradient(
            circle at 12% 8%,
            rgba(20, 157, 242, 0.12),
            transparent 24%
          ),
          linear-gradient(180deg, #ffffff 0%, #f4f7fa 100%);
      }
      .sidebar-gradient {
        background-image:
          radial-gradient(
            circle at 20% 8%,
            rgba(20, 157, 242, 0.24),
            transparent 28%
          ),
          linear-gradient(180deg, #07152f 0%, #0a1f42 58%, #241449 100%);
      }
    </style>
  </head>

  <body class="dashboard-bg min-h-screen text-slate-900 antialiased">
    <div
      data-sidebar-overlay
      class="fixed inset-0 z-40 hidden bg-navy/60 backdrop-blur-sm lg:hidden"
    ></div>

    <div class="min-h-screen lg:grid lg:grid-cols-[290px_1fr]">
      <!-- Sidebar -->
      <aside
        data-sidebar
        class="sidebar-gradient fixed inset-y-0 left-0 z-50 flex w-[290px] -translate-x-full flex-col border-r border-white/10 text-white shadow-soft transition duration-300 lg:sticky lg:top-0 lg:h-screen lg:translate-x-0"
      >
        <div class="flex h-20 items-center justify-between px-5">
          <a href="#" class="flex items-center gap-3">
            <span
              class="grid size-12 place-items-center rounded-2xl bg-blue text-white shadow-glow"
            >
              <i class="fa-solid fa-people-group text-xl"></i>
            </span>
            <span class="leading-none">
              <span class="block text-lg font-black tracking-tight"
                >TRYRECRUITERS</span
              >
              <span
                class="block text-[10px] font-bold uppercase tracking-[.22em] text-blue"
                >Employer area</span
              >
            </span>
          </a>
          <button
            type="button"
            data-close-sidebar
            class="grid size-10 place-items-center rounded-2xl bg-white/10 text-white lg:hidden"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <nav class="mt-6 flex-1 space-y-1 overflow-y-auto px-4 pb-5">
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
            ><i class="fa-solid fa-table-columns w-5"></i> Dashboard</a
          >
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
            ><i class="fa-solid fa-user-tie w-5"></i> My Profile</a
          >
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl bg-white px-4 py-3 text-sm font-black text-blue shadow-card"
            ><i class="fa-solid fa-building w-5"></i> Companies</a
          >
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
            ><i class="fa-solid fa-briefcase w-5"></i> Job Offers</a
          >
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
            ><i class="fa-solid fa-bookmark w-5"></i> My Favorites</a
          >
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
            ><i class="fa-solid fa-file-signature w-5"></i> My Applications</a
          >
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
            ><i class="fa-solid fa-video w-5"></i> My Interviews</a
          >
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
            ><i class="fa-solid fa-file-lines w-5"></i> CV</a
          >
          <a
            href="#"
            class="flex items-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold text-white/70 transition hover:bg-white/10 hover:text-white"
            ><i class="fa-solid fa-gear w-5"></i> Settings</a
          >
        </nav>

        <div class="border-t border-white/10 p-4">
          <button
            type="button"
            class="flex w-full items-center justify-center gap-2 rounded-2xl bg-coral px-4 py-3 text-sm font-black text-white transition hover:bg-red-600"
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
          </button>
        </div>
      </aside>

      <!-- Main area -->
      <div class="min-w-0">
        <!-- Topbar -->
        <header
          class="sticky top-0 z-30 border-b border-line bg-white/90 backdrop-blur-xl"
        >
          <div
            class="mx-auto flex h-20 max-w-[1040px] items-center justify-between gap-4 px-5 lg:px-8"
          >
            <div class="flex min-w-0 items-center gap-3">
              <button
                type="button"
                data-open-sidebar
                class="grid size-11 shrink-0 place-items-center rounded-2xl border border-line bg-white text-navy shadow-sm lg:hidden"
              >
                <i class="fa-solid fa-bars"></i>
              </button>
              <a
                href="#"
                class="grid size-11 shrink-0 place-items-center rounded-2xl border border-line bg-white text-slate-600 shadow-sm transition hover:border-blue hover:text-blue"
                aria-label="Back to companies"
              >
                <i class="fa-solid fa-arrow-left"></i>
              </a>
              <div class="min-w-0">
                <p
                  class="text-xs font-black uppercase tracking-[.18em] text-blue"
                >
                  Companies
                </p>
                <h1 class="truncate text-xl font-black text-navy md:text-2xl">
                  Company form
                </h1>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <button
                type="button"
                class="relative grid size-11 place-items-center rounded-2xl border border-line bg-white text-slate-600 shadow-sm transition hover:border-blue hover:text-blue"
              >
                <i class="fa-regular fa-bell"></i>
                <span
                  class="absolute right-2 top-2 size-2 rounded-full bg-coral"
                ></span>
              </button>
              <div
                class="flex items-center gap-3 rounded-2xl border border-line bg-white p-1.5 shadow-sm"
              >
                <img
                  src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80"
                  alt="Employer"
                  class="size-9 rounded-xl object-cover"
                />
                <div class="hidden pr-2 leading-tight sm:block">
                  <p class="text-xs font-black text-navy">David Miller</p>
                  <p class="text-[11px] font-bold text-slate-400">Recruiter</p>
                </div>
              </div>
            </div>
          </div>
        </header>

        <main class="mx-auto max-w-[1040px] px-5 py-7 lg:px-8">
          <form
            data-company-form
            class="rounded-[30px] border border-line bg-white p-6 shadow-card md:p-8"
          >
            <div
              class="mb-7 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"
            >
              <div>
                <p
                  class="text-sm font-black uppercase tracking-[.18em] text-blue"
                >
                  Create / Update
                </p>
                <h2
                  class="mt-2 font-display text-4xl font-black leading-none text-navy md:text-5xl"
                >
                  Company information
                </h2>
              </div>
              <span
                class="inline-flex w-fit items-center gap-2 rounded-full bg-skysoft px-4 py-2 text-xs font-black text-blue"
              >
                <i class="fa-solid fa-building"></i> Company profile
              </span>
            </div>

            <div class="grid gap-5 md:grid-cols-2">
              <label class="block">
                <span class="text-sm font-black text-navy"
                  >Company name <span class="text-coral">*</span></span
                >
                <input
                  required
                  type="text"
                  value="NexarTrust Analytics"
                  class="mt-2 h-13 w-full rounded-2xl border border-line bg-white px-4 py-3 text-sm font-semibold text-slate-700 outline-none transition focus:border-blue focus:ring-4 focus:ring-blue/10"
                  placeholder="Company name"
                />
              </label>

              <label class="block">
                <span class="text-sm font-black text-navy"
                  >Industry <span class="text-coral">*</span></span
                >
                <select
                  required
                  class="mt-2 h-13 w-full rounded-2xl border border-line bg-white px-4 py-3 text-sm font-semibold text-slate-700 outline-none transition focus:border-blue focus:ring-4 focus:ring-blue/10"
                >
                  <option>Finance</option>
                  <option>Technology</option>
                  <option>Cybersecurity</option>
                  <option>Healthcare</option>
                  <option>Education</option>
                  <option>Marketing</option>
                </select>
              </label>

              <label class="block">
                <span class="text-sm font-black text-navy">Company size</span>
                <select
                  class="mt-2 h-13 w-full rounded-2xl border border-line bg-white px-4 py-3 text-sm font-semibold text-slate-700 outline-none transition focus:border-blue focus:ring-4 focus:ring-blue/10"
                >
                  <option>1-50 employees</option>
                  <option selected>51-250 employees</option>
                  <option>251-1000 employees</option>
                  <option>1000+ employees</option>
                </select>
              </label>

              <label class="block">
                <span class="text-sm font-black text-navy">Founded year</span>
                <input
                  type="number"
                  value="2018"
                  class="mt-2 h-13 w-full rounded-2xl border border-line bg-white px-4 py-3 text-sm font-semibold text-slate-700 outline-none transition focus:border-blue focus:ring-4 focus:ring-blue/10"
                  placeholder="2018"
                />
              </label>

              <label class="block">
                <span class="text-sm font-black text-navy"
                  >Location <span class="text-coral">*</span></span
                >
                <div
                  class="mt-2 flex h-13 items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 transition focus-within:border-blue focus-within:ring-4 focus-within:ring-blue/10"
                >
                  <i class="fa-solid fa-location-dot text-blue"></i>
                  <input
                    required
                    type="text"
                    value="Paris, France"
                    class="w-full bg-transparent text-sm font-semibold text-slate-700 outline-none"
                    placeholder="City, country"
                  />
                </div>
              </label>

              <label class="block">
                <span class="text-sm font-black text-navy">Website</span>
                <div
                  class="mt-2 flex h-13 items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 transition focus-within:border-blue focus-within:ring-4 focus-within:ring-blue/10"
                >
                  <i class="fa-solid fa-globe text-blue"></i>
                  <input
                    type="url"
                    value="https://nexartrust.example"
                    class="w-full bg-transparent text-sm font-semibold text-slate-700 outline-none"
                    placeholder="https://company.com"
                  />
                </div>
              </label>

              <label class="block">
                <span class="text-sm font-black text-navy">Public email</span>
                <div
                  class="mt-2 flex h-13 items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 transition focus-within:border-blue focus-within:ring-4 focus-within:ring-blue/10"
                >
                  <i class="fa-solid fa-envelope text-blue"></i>
                  <input
                    type="email"
                    value="hello@nexartrust.example"
                    class="w-full bg-transparent text-sm font-semibold text-slate-700 outline-none"
                    placeholder="hello@company.com"
                  />
                </div>
              </label>

              <label class="block">
                <span class="text-sm font-black text-navy">Phone number</span>
                <div
                  class="mt-2 flex h-13 items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 transition focus-within:border-blue focus-within:ring-4 focus-within:ring-blue/10"
                >
                  <i class="fa-solid fa-phone text-blue"></i>
                  <input
                    type="tel"
                    value="+33 1 22 34 56 78"
                    class="w-full bg-transparent text-sm font-semibold text-slate-700 outline-none"
                    placeholder="+33 1 22 34 56 78"
                  />
                </div>
              </label>

              <label class="block md:col-span-2">
                <span class="text-sm font-black text-navy">Company logo</span>
                <div
                  class="mt-2 grid gap-4 rounded-2xl border border-line bg-slate-50 p-4 sm:grid-cols-[96px_1fr] sm:items-center"
                >
                  <span
                    class="grid size-24 place-items-center rounded-2xl bg-gradient-to-br from-violet-600 to-ink text-2xl font-black text-white shadow-card"
                    >NT</span
                  >
                  <div>
                    <input
                      type="file"
                      accept="image/*"
                      class="block w-full cursor-pointer rounded-2xl border border-line bg-white text-sm font-semibold text-slate-600 file:mr-4 file:border-0 file:bg-blue file:px-4 file:py-3 file:text-sm file:font-black file:text-white hover:file:bg-blue2"
                    />
                    <p class="mt-2 text-xs font-bold text-slate-400">
                      PNG, JPG or JPEG. Square format recommended.
                    </p>
                  </div>
                </div>
              </label>

              <label class="block md:col-span-2">
                <span class="text-sm font-black text-navy"
                  >Company description <span class="text-coral">*</span></span
                >
                <textarea
                  required
                  rows="6"
                  class="mt-2 w-full resize-none rounded-2xl border border-line bg-white px-4 py-4 text-sm font-semibold leading-7 text-slate-700 outline-none transition focus:border-blue focus:ring-4 focus:ring-blue/10"
                  placeholder="Describe your company, mission and team culture..."
                >
AI-powered fraud detection and financial risk analytics for modern finance teams.</textarea
                >
              </label>
            </div>

            <div
              class="mt-7 flex flex-col-reverse gap-3 border-t border-line pt-6 sm:flex-row sm:justify-end"
            >
              <button
                type="button"
                class="rounded-2xl border border-line bg-white px-6 py-3 text-sm font-black text-navy transition hover:border-blue hover:text-blue"
              >
                Cancel
              </button>
              <button
                type="button"
                class="rounded-2xl border border-line bg-white px-6 py-3 text-sm font-black text-navy transition hover:border-blue hover:text-blue"
              >
                Save draft
              </button>
              <button
                type="submit"
                class="rounded-2xl bg-blue px-6 py-3 text-sm font-black text-white shadow-glow transition hover:bg-blue2"
              >
                Save company
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <script>
      const sidebar = document.querySelector("[data-sidebar]");
      const sidebarOverlay = document.querySelector("[data-sidebar-overlay]");
      const openSidebar = document.querySelector("[data-open-sidebar]");
      const closeSidebar = document.querySelector("[data-close-sidebar]");

      function showSidebar() {
        sidebar.classList.remove("-translate-x-full");
        sidebarOverlay.classList.remove("hidden");
      }

      function hideSidebar() {
        sidebar.classList.add("-translate-x-full");
        sidebarOverlay.classList.add("hidden");
      }

      openSidebar.addEventListener("click", showSidebar);
      closeSidebar.addEventListener("click", hideSidebar);
      sidebarOverlay.addEventListener("click", hideSidebar);
    </script>
  </body>
</html>
