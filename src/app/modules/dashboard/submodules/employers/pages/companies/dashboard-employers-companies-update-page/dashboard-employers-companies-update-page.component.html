<button
  class="my-2 bg-primary app-primary"
  *transloco="let t; read: 'companies'"
  (click)="handleBack()"
>
  <i class="fas fa-chevron-left mr-1 text-white"></i>
  {{ t("common.previous") }}
</button>

<div
  class="py-6 w-full bg-white rounded-sm flex flex-col"
  *transloco="let t; read: 'companies'"
>
  <h2 class="text-2xl pb-2 font-bold text-primary">{{ t("updateTitle") }}</h2>

  <app-companies-form
    [defaultValues]="item"
    [isLoading]="isLoading"
    (onSubmit)="onSubmit($event)"
  ></app-companies-form>

  <app-generic-error
    *ngIf="hasError"
    [message]="errorMessage"
  ></app-generic-error>
</div>
