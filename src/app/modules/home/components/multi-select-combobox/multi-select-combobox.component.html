<div class="relative" (click)="$event.stopPropagation()">
  <!-- Trigger -->
  <div
    (click)="toggle()"
    class="flex min-h-11 w-full cursor-pointer items-center gap-2 rounded-xl border border-line bg-white px-3 py-1.5 text-left text-xs font-bold text-slate-700 outline-none transition hover:border-blue focus-within:border-blue"
    [class.border-blue]="isOpen"
    [class.ring-4]="isOpen"
    [class.ring-blue/10]="isOpen"
  >
    <!-- Chips -->
    <div class="flex min-w-0 flex-wrap items-center gap-1">
      <span
        *ngFor="let chip of visibleChips"
        class="inline-flex max-w-[120px] items-center gap-1 rounded-lg bg-skysoft px-2 py-1 text-[10px] font-black text-blue"
      >
        <span class="truncate">{{ chip.label }}</span>
        <button
          type="button"
          (click)="removeValue(chip.value, $event)"
          class="text-blue/70 hover:text-coral"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </span>
      <span
        *ngIf="remainingCount > 0"
        class="rounded-lg bg-slate-100 px-2 py-1 text-[10px] font-black text-slate-500"
        >+{{ remainingCount }}</span
      >
    </div>
    <input
      #searchInput
      type="text"
      [(ngModel)]="searchQuery"
      class="min-w-[92px] flex-1 bg-transparent py-1 font-bold outline-none placeholder:text-slate-400"
      [placeholder]="displayPlaceholder"
      autocomplete="off"
      (click)="open()"
    />
    <i
      class="fa-solid fa-chevron-down shrink-0 text-[10px] text-slate-400 transition"
      [class.rotate-180]="isOpen"
    ></i>
  </div>

  <!-- Dropdown -->
  <div
    *ngIf="isOpen"
    class="absolute left-0 right-0 z-40 mt-2 rounded-2xl border border-line bg-white p-2 shadow-soft"
  >
    <!-- Clear button -->
    <button
      *ngIf="selectedValues.length > 0"
      type="button"
      (click)="clearAll()"
      class="mb-1 flex w-full items-center gap-2 rounded-xl px-3 py-2 text-left text-xs font-black text-coral hover:bg-red-50"
    >
      <i class="fa-solid fa-xmark"></i> Clear {{ placeholder }}
    </button>

    <!-- Options -->
    <div class="max-h-64 overflow-y-auto">
      <button
        *ngFor="let option of filteredOptions"
        type="button"
        (click)="toggleOption(option)"
        class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-xs font-bold text-slate-700 hover:bg-skysoft hover:text-blue"
      >
        <span>{{ option.label }}</span>
        <span
          class="grid size-5 place-items-center rounded-md"
          [ngClass]="
            isSelected(option.value)
              ? 'bg-blue text-white'
              : 'border border-line text-transparent'
          "
        >
          <i class="fa-solid fa-check text-[10px]"></i>
        </span>
      </button>

      <p
        *ngIf="filteredOptions.length === 0"
        class="px-3 py-3 text-xs font-bold text-slate-400"
      >
        No results found.
      </p>
    </div>
  </div>
</div>
