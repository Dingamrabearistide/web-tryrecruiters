<div class="overview-container">
  <!-- Header -->
  <div class="overview-header">
    <h1>{{ "dashboard.admin.overview.title" | transloco }}</h1>
    <button
      mat-raised-button
      color="primary"
      (click)="refresh()"
      [disabled]="isLoading"
    >
      <mat-icon>refresh</mat-icon>
      {{ "common.refresh" | transloco }}
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <!-- KPI Grid -->
  <div *ngIf="!isLoading && kpiCards.length > 0" class="kpi-grid">
    <mat-card
      *ngFor="let card of kpiCards"
      class="kpi-card"
      [style.border-top]="'4px solid ' + card.color"
    >
      <mat-card-header>
        <mat-card-title-group>
          <mat-icon class="kpi-icon" [style.color]="card.color">
            {{ card.icon }}
          </mat-icon>
          <mat-card-title>
            {{ card.label | transloco }}
          </mat-card-title>
        </mat-card-title-group>
      </mat-card-header>

      <mat-card-content>
        <div class="kpi-value">{{ card.value | number }}</div>
        <p class="kpi-description" *ngIf="card.description">
          {{ card.description | transloco }}
        </p>
      </mat-card-content>
    </mat-card>
  </div>

  <!-- Empty State -->
  <mat-card *ngIf="!isLoading && kpiCards.length === 0" class="empty-state">
    <mat-card-content>
      <mat-icon class="empty-icon">dashboard</mat-icon>
      <p>{{ "common.noData" | transloco }}</p>
    </mat-card-content>
  </mat-card>
</div>
