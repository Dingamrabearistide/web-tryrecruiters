<div class="flex flex-col w-full" *transloco="let t; read: 'companies'">
  <!-- Header Section -->
  <div class="flex flex-col gap-3 justify-between items-start mb-4">
    <div class="flex w-full justify-between items-center">
      <div>
        <h1 class="text-3xl pb-2 font-bold text-primary">
          {{ t("list.title") }}
        </h1>
        <p class="text-gray-600 text-sm font-normal">
          {{ t("list.description") }}
        </p>
      </div>
      <div>
        <button
          (click)="handleCreate()"
          class="bg-primary text-white rounded-lg font-semibold shadow-md transition-all duration-200 flex items-center justify-center gap-2 hover:opacity-90 hover:shadow-lg hover:scale-105 w-10 h-10 sm:w-auto sm:h-auto sm:px-6 sm:py-3"
        >
          <i class="fas fa-plus"></i>
          <span class="hidden sm:inline">{{ t("form.company") }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="mx-0 lg:mx-0 pb-8">
    <!-- Filters Section -->
    <div class="flex flex-col md:flex-row flex-wrap gap-3 items-end mb-7 w-full">

      <!-- Posted Date -->
      <div class="flex flex-col w-full md:max-w-[200px] min-w-[160px]">
        <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="postedDate">
          <i class="fas fa-calendar-alt text-gray-500"></i>
          {{ t("form.postedDate") }}
        </label>
        <div class="relative h-[40px]">
          <select
            id="postedDate"
            [(ngModel)]="postedDate"
            (change)="onSearch()"
            class="appearance-none w-full h-full bg-white border border-gray-300 outline-none rounded px-4 py-2 pr-8 text-sm shadow-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          >
            <option value="">{{ t("form.selectPostedDate") }}</option>
            <option value="anytime">{{ t("form.postedDateOptions.anytime") }}</option>
            <option value="past_24h">{{ t("form.postedDateOptions.past_24h") }}</option>
            <option value="past_week">{{ t("form.postedDateOptions.past_week") }}</option>
            <option value="past_month">{{ t("form.postedDateOptions.past_month") }}</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500">
            <i class="fas fa-chevron-down"></i>
          </div>
        </div>
      </div>

      <!-- City -->
      <div class="flex flex-col w-full md:max-w-[180px] min-w-[140px]">
        <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="city">
          <i class="fas fa-city text-gray-500"></i>
          {{ t("form.city") }}
        </label>
        <input
          type="text"
          id="city"
          [(ngModel)]="city"
          (keyup.enter)="onSearch()"
          (keydown)="blockNonCityChars($event)"
          placeholder="{{ t('form.city') }}"
          class="h-[40px] w-full border border-gray-300 outline-none rounded-[5px] px-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
        />
      </div>

      <!-- Country -->
      <div class="flex flex-col w-full md:max-w-[180px] min-w-[160px]">
        <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="country">
          <i class="fas fa-globe text-gray-500"></i>
          {{ t("form.country") }}
        </label>
        <div class="h-[40px] [&_button]:h-full [&_button]:rounded-[5px] [&_button]:border-gray-300 [&_button]:shadow-sm [&_button]:font-normal">
          <app-country-select
            [(ngModel)]="country"
            (ngModelChange)="onSearch()"
            [placeholder]="t('form.country')"
          ></app-country-select>
        </div>
      </div>

      <!-- Search -->
      <div class="relative flex-1 max-w-[280px] min-w-[180px] h-[40px]">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
          <i class="fas fa-search text-gray-400"></i>
        </span>
        <input
          id="search"
          type="text"
          placeholder="{{ t('form.searchPlaceholder') }}"
          [(ngModel)]="keyword"
          (keyup.enter)="onSearch()"
          class="h-full w-full border border-gray-300 outline-none rounded-[5px] pl-10 pr-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
        />
      </div>

      <!-- Buttons -->
      <div class="flex gap-2 w-full md:w-fit h-[40px]">
        <button (click)="onSearch()" class="btn-filter-search h-full">
          <i class="fas fa-search"></i>
          {{ t("form.search") }}
        </button>
        <button (click)="onReset()" class="btn-filter-reset h-full">
          <i class="fas fa-times"></i>
          {{ t("form.reset") }}
        </button>
      </div>
    </div>
    <div *ngIf="isLoading" class="grid grid-rows-[1fr] h-[400px]">
      <div class="w-full text-center h-full">
        <app-loader></app-loader>
      </div>
    </div>

    <div *ngIf="!isLoading && hasError" class="w-full">
      <app-generic-error
        *ngIf="hasError"
        [message]="errorMessage"
      ></app-generic-error>
    </div>

    <div *ngIf="!isLoading && !hasError" class="max-w-full w-full">
      <app-companies-datatable
        [items]="items"
        [isLoading]="false"
        [hasError]="false"
        (create)="handleCreate()"
        (view)="handleView($event)"
        (update)="handleUpdate($event)"
        (delete)="handleDelete($event)"
      ></app-companies-datatable>
    </div>

    <div class="flex justify-end mb-4">
      <app-generic-paginator
        [currentPage]="page"
        [totalPages]="totalPages"
        [maxVisible]="5"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)"
      ></app-generic-paginator>
    </div>
  </div>

  <app-generic-error
    *ngIf="hasError"
    [message]="errorMessage"
  ></app-generic-error>
</div>
