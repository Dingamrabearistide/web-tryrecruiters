<div *transloco="let t; read: 'candidates'" class="flex items-start gap-4">
  <!-- Icône -->
  <div
    class="flex-shrink-0 w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center"
  >
    <i
      class="fa fa-graduation-cap text-primary text-2xl"
      aria-hidden="true"
    ></i>
  </div>

  <!-- Contenu -->
  <div class="flex-1 min-w-0">
    <!-- Titre et école -->
    <h4 class="text-base font-medium text-gray-900 mb-1">
      {{ item.degree }}
    </h4>
    <p class="text-sm text-gray-600 mb-1">
      {{ item.schoolName }}
      <span *ngIf="item.fieldOfStudy" class="text-gray-500">
        · {{ item.fieldOfStudy }}
      </span>
    </p>

    <!-- Dates -->
    <p class="text-sm text-gray-500">
      {{ item.startDate | date : "MMM yyyy" }}
      <span *ngIf="item.endDate">
        - {{ item.endDate | date : "MMM yyyy" }}
      </span>
      <span *ngIf="!item.endDate">
        - {{ t("candidateDetails.present") || "Présent" }}
      </span>
    </p>

    <!-- Description avec toggle -->
    <div *ngIf="item.description" class="mt-3">
      <button
        (click)="toggleDetails('item-' + item.id)"
        class="inline-flex items-center gap-1.5 text-sm font-medium text-primary hover:text-blue-700 transition-colors"
      >
        <span>{{
          showMore["item-" + item.id]
            ? t("candidateDetails.showLess") || "Voir moins"
            : t("candidateDetails.showMore") || "Voir plus"
        }}</span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4 transition-transform duration-200"
          [ngClass]="{ 'rotate-180': showMore['item-' + item.id] }"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.5 8.25l-7.5 7.5-7.5-7.5"
          />
        </svg>
      </button>

      <!-- Description expandable -->
      <div
        *ngIf="showMore['item-' + item.id]"
        class="mt-2 text-sm text-gray-700 leading-relaxed"
      >
        <p>{{ item.description }}</p>
      </div>
    </div>
  </div>
</div>
