<!-- MAIN START -->
<div *transloco="let t; read: 'resumes'" class="flex-1 flex flex-col">
  <div class="flex flex-col w-full">
    <!-- Header Section -->
    <div class="flex flex-col gap-3 justify-between items-start mb-6 pb-5">
      <div class="flex w-full justify-between items-center">
        <div>
          <h1 class="text-3xl pb-2 font-bold text-primary">
            {{ t("list.title") }}
          </h1>
          <p class="text-gray-600 text-sm font-normal">
            {{ t("list.description") }}
          </p>
        </div>
        <button
          [routerLink]="['../create']"
          class="bg-primary text-white rounded-lg font-semibold shadow-md hover:bg-blue-700 transition-all duration-200 flex items-center justify-center gap-2 w-10 h-10 sm:w-auto sm:h-auto sm:px-6 sm:py-3"
        >
          <i class="fas fa-plus"></i>
          <span class="hidden sm:inline">{{ t("form.resume") }}</span>
        </button>
      </div>
    </div>

    <div class="mx-0 lg:mx-0 pb-8">
      <!-- Search Section -->
      <div class="flex flex-wrap gap-3 items-end mb-7 w-full">

        <!-- isDefault -->
        <div class="flex flex-col min-w-[160px]">
          <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="isDefault">
            <i class="fas fa-star text-gray-500"></i>
            {{ t("form.isDefault") }}
          </label>
          <div class="relative h-[40px]">
            <select
              id="isDefault"
              [(ngModel)]="isDefault"
              (change)="onSearch()"
              class="appearance-none w-full h-full bg-white border border-gray-300 outline-none rounded px-4 py-2 pr-8 text-sm shadow-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all"
            >
              <option value="">{{ t("form.allValues") }}</option>
              <option value="true">{{ t("status.default") }}</option>
              <option value="false">{{ t("status.notDefault") }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500">
              <i class="fas fa-chevron-down"></i>
            </div>
          </div>
        </div>

        <!-- createdAfter -->
        <div class="flex flex-col min-w-[160px]">
          <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="createdAfter">
            <i class="fas fa-calendar-alt text-gray-500"></i>
            {{ t("form.createdAfter") }}
          </label>
          <input
            type="date"
            id="createdAfter"
            [(ngModel)]="createdAfter"
            (change)="onSearch()"
            class="h-[40px] border border-gray-300 outline-none rounded-[5px] px-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          />
        </div>

        <!-- createdBefore -->
        <div class="flex flex-col min-w-[160px]">
          <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="createdBefore">
            <i class="fas fa-calendar-check text-gray-500"></i>
            {{ t("form.createdBefore") }}
          </label>
          <input
            type="date"
            id="createdBefore"
            [(ngModel)]="createdBefore"
            (change)="onSearch()"
            class="h-[40px] border border-gray-300 outline-none rounded-[5px] px-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          />
        </div>

        <!-- Search + buttons row -->
        <div class="filter-actions-wrap">
          <div class="relative flex-grow">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
              <i class="fas fa-search text-gray-400"></i>
            </span>
            <input
              id="search"
              type="text"
              placeholder="{{ t('form.searchPlaceholder') }}"
              [(ngModel)]="searchTerm"
              (keyup.enter)="onSearch()"
              class="h-10 w-full border border-gray-300 outline-none rounded-[5px] pl-10 pr-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
            />
          </div>
          <div class="filter-actions-buttons">
            <button class="btn-filter-search" (click)="onSearch()">
              <i class="fas fa-search"></i>
              {{ t("form.search") }}
            </button>
            <button type="button" class="btn-filter-reset" (click)="onReset()">
              <i class="fas fa-times"></i>
              {{ t("form.reset") }}
            </button>
          </div>
        </div>

      </div>

      <!-- Content Section -->
      <div class="max-w-full w-full">
        <!-- Loading State -->
        <div *ngIf="isLoading" class="grid grid-rows-[1fr] h-[400px]">
          <div class="w-full text-center h-full">
            <app-loader></app-loader>
          </div>
        </div>

        <!-- Error State -->
        <div *ngIf="!isLoading && hasError" class="w-full">
          <app-generic-error
            *ngIf="hasError"
            [message]="errorMessage"
          ></app-generic-error>
        </div>

        <!-- Success State -->
        <div *ngIf="!isLoading && !hasError">
          <!-- Empty State -->
          <div *ngIf="items.length === 0" class="bg-white w-full shadow overflow-x-auto">
            <div class="text-center py-12">
            <div class="mb-4">
              <i class="fas fa-file-pdf text-6xl text-gray-300"></i>
            </div>
            <h3 class="text-xl font-semibold text-gray-700 mb-2">
              {{ t("empty.title") }}
            </h3>
            <p class="text-gray-500 mb-6">
              {{ t("empty.subtitle") }}
            </p>
            <button
              [routerLink]="['../create']"
              class="bg-primary text-white px-6 py-3 rounded-lg font-semibold shadow-md hover:bg-blue-700 transition-all duration-200 flex items-center gap-2 mx-auto"
            >
              <i class="fas fa-plus"></i>
              <span>{{ t("empty.action") }}</span>
            </button>
          </div>
          </div>

          <!-- Data Table -->
          <div *ngIf="items.length > 0">
            <app-resumes-datatable
              [items]="items"
              [isLoading]="false"
              [hasError]="false"
              (view)="handleView($event)"
              (update)="handleUpdate($event)"
              (delete)="handleDelete($event)"
              (download)="handleDownload($event)"
              (setDefault)="handleSetDefault($event)"
            ></app-resumes-datatable>

            <!-- Pagination -->
            <div class="flex justify-end mb-4 mt-6">
              <app-generic-paginator
                [currentPage]="page"
                [totalPages]="totalPages"
                [maxVisible]="5"
                (pageChange)="onPageChange($event)"
              ></app-generic-paginator>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- MAIN END -->
