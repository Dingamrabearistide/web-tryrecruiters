<div class="cursor-pointer relative inline-block dropdown-wrapper mt-2">
  <!-- Bell Icon Button -->
  <span
    (click)="toggleDropdown()"
    type="button"
    class="relative translate-x-2 p-2 text-gray-400"
    [attr.aria-label]="
      'View notifications (' + unreadNotificationsCount + ' unread)'
    "
    (click)="toggleNotificationMenu()"
    [attr.aria-expanded]="notificationMenuOpen"
    id="notificationButton"
  >
    <i class="fas fa-bell text-xl"></i>
    <span
      *ngIf="unreadNotificationsCount > 0"
      class="absolute -top-1 -right-1 h-4 w-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center font-medium"
    >
      {{ unreadNotificationsCount }}
    </span>
  </span>
