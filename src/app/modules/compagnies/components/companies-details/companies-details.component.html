<div *transloco="let t; read: 'companies'">

    <!-- Background Image -->

    <!-- Profile Section -->
    <div class="flex flex-col md:flex-row items-center gap-2">
      <div
        class="overflow-hidden w-[100px] h-full max-w-sm max-h-[150px] bg-gray-50 mr-2"
      >
        <img
          [src]="item.logoFile?.url || item.logoUrl || '/images/no-image.jpg'"
          alt="Profile"
          class="w-full h-full object-cover"
        />
      </div>

      <div>
        <div class="text-4xl font-semibold text-gray-800">
          {{ item.name }}
        </div>

        <!-- <app-read-more

      </div>
    </div>
  </div>
