<form
  *transloco="let t; read: 'auth'"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="w-full space-y-5"
>
  <!-- Email Field -->
  <label class="block">
    <span class="text-sm font-black text-navy">
      {{ t("login.emailLabel") }}
    </span>

    <div
      class="mt-2 flex h-13 items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 transition focus-within:border-blue focus-within:ring-4 focus-within:ring-blue/10"
    >
      <i class="fa-solid fa-envelope text-blue"></i>

      <input
        id="email"
        type="email"
        formControlName="email"
        [placeholder]="t('login.emailPlaceholder')"
        class="w-full bg-transparent text-sm font-semibold text-slate-700 outline-none"
      />
    </div>

    <app-form-field-errors
      fieldName="login"
      [control]="form.get('email')"
    ></app-form-field-errors>
  </label>

  <!-- Password Field -->
  <label class="block">
    <span class="text-sm font-black text-navy">
      {{ t("login.passwordLabel") }}
    </span>

    <div
      class="mt-2 flex h-13 items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 transition focus-within:border-blue focus-within:ring-4 focus-within:ring-blue/10"
    >
      <i class="fa-solid fa-lock text-blue"></i>

      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        formControlName="password"
        [placeholder]="t('login.passwordPlaceholder')"
        class="w-full bg-transparent text-sm font-semibold text-slate-700 outline-none"
      />

      <button
        type="button"
        class="text-slate-400 transition hover:text-blue"
        (click)="showPassword = !showPassword"
        tabindex="-1"
      >
        <span *ngIf="showPassword">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
            />
          </svg>
        </span>

        <span *ngIf="!showPassword">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        </span>
      </button>
    </div>

    <app-form-field-errors
      fieldName="password"
      [control]="form.get('password')"
    ></app-form-field-errors>
  </label>

  <div class="mt-4">
    <ng-content></ng-content>
  </div>

  <!-- Submit -->
  <button
    [disabled]="isLoading"
    type="submit"
    class="flex w-full items-center justify-center gap-2 rounded-2xl bg-blue px-6 py-4 text-sm font-black text-white shadow-glow transition hover:bg-blue2 disabled:cursor-not-allowed disabled:opacity-70"
  >
    <div *ngIf="isLoading" class="flex items-center justify-center">
      <app-loader [showText]="false" class="text-white"></app-loader>
      <span class="ml-2">{{ t("loading") }}</span>
    </div>

    <span *ngIf="!isLoading">
      {{ t("login.submitButton") }}
    </span>
  </button>
</form>
