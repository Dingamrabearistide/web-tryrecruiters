<div
  *transloco="let tCore"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm animate-fade-in"
  role="dialog"
  aria-modal="true"
>
  <div
    [ngClass]="
      'bg-white rounded-xl shadow-2xl w-full mx-4 max-h-[90vh] overflow-hidden animate-scale-in ' +
      sizeClass
    "
  >
    <!-- Header -->
    <div
      class="flex items-center justify-between px-6 py-4 border-b border-gray-200"
    >
      <h2 *ngIf="data.title" class="text-xl font-semibold text-gray-900">
        {{ data.title }}
      </h2>
      <span
        *ngIf="data.showCloseButton !== false"
        (click)="onClose()"
        class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors duration-200"
        aria-label="Fermer"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </span>
    </div>

    <!-- Content -->
    <div class="px-6 py-4 overflow-y-auto max-h-[70vh]">
      <ng-container [ngSwitch]="data.type">
        <div *ngSwitchCase="'confirm'">
          <p class="text-gray-700 mb-6">{{ data.message }}</p>
        </div>
        <div *ngSwitchCase="'alert'">
          <p class="text-gray-700 mb-6">{{ data.message }}</p>
        </div>
        <form
          *ngSwitchCase="'form'"
          [formGroup]="data.formGroup"
          (ngSubmit)="onConfirm()"
        >
          <ng-container
            *ngTemplateOutlet="
              data.contentTemplate ? data.contentTemplate : null;
              context: { $implicit: data.formGroup }
            "
          ></ng-container>
        </form>
        <ng-container *ngSwitchDefault>
          <ng-container
            *ngTemplateOutlet="data.contentTemplate ?? null"
          ></ng-container>
        </ng-container>
      </ng-container>
    </div>

    <!-- Footer -->
    <div
      *ngIf="data.type === 'confirm' || data.type === 'form'"
      class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3"
    >
      <button (click)="onCancel()" class="btn-secondary">
        <span class="text-white">
          {{ data.cancelText || tCore("general.cancel") }}
        </span>
      </button>
      <button (click)="onConfirm()" class="app-primary">
        <span class="text-white">
          {{ data.confirmText || tCore("general.confirm") }}
        </span>
      </button>
    </div>
    <div
      *ngIf="data.type === 'alert'"
      class="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end"
    >
      <button (click)="onClose()" class="app-primary">
        <span class="text-white">{{ tCore("general.ok") }}</span>
      </button>
    </div>
  </div>
</div>
