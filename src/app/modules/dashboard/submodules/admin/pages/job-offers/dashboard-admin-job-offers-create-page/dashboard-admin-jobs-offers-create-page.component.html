<button
  class="my-2 bg-primary app-primary"
  *transloco="let t"
  (click)="handleBack()"
>
  <i class="fas fa-chevron-left mr-1 text-white"></i>
  {{ t("general.back") }}
</button>

<div
  class="py-6 w-full bg-white rounded-sm flex flex-col"
  *transloco="let t; read: 'joboffers'"
>
  <h2 class="text-2xl pb-2 font-bold text-primary">{{ t("form.createJob") }}</h2>

  <div *ngIf="isLoadingInit" class="grid grid-rows-[1fr] h-[400px]">
    <div class="w-full text-center h-full">
      <app-loader></app-loader>
    </div>
  </div>

  <app-generic-error
    *ngIf="!isLoadingInit && hasErrorInit"
    [message]="errorMessageInit"
  ></app-generic-error>

  <ng-container *ngIf="!isLoadingInit && !hasErrorInit">
    <app-job-offers-form
      [companies]="companies"
      [isLoading]="isLoading"
      (onSubmit)="onSubmit($event)"
    ></app-job-offers-form>

    <app-generic-error
      *ngIf="hasError"
      [message]="errorMessage"
    ></app-generic-error>
  </ng-container>
</div>
