<app-generic-form
  #genericFormComp
  [isLoading]="isLoading"
  [defaultValues]="defaultValues"
  [fieldConfigurations]="genericFormConfig"
  [showActionButton]="true"
  (submitForm)="handleSubmit($event)"
  transationNamespace="companies"
></app-generic-form>

<!-- Custom action buttons so we can enable Save only when appropriate
     - For update (defaultValues present): enable only when form.dirty && form.valid
     - For create: enable when form.valid -->
