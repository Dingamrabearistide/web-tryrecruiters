<div
  *transloco="let t; read: 'candidates'"
  class="bg-white rounded-lg border border-gray-200 p-6 mb-5"
>
  <!-- En-tête avec titre et bouton d'ajout -->
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-xl font-semibold text-primary">
      {{ t("profilePage.languages.title") || "Langues" }}
    </h3>
    <button
      (click)="addItem()"
      class="inline-flex items-center justify-center w-9 h-9 text-sm font-medium text-white bg-primary rounded-md hover:bg-blue-700 transition-colors"
    >
      <i class="fa fa-plus text-sm"></i>
    </button>
  </div>

  <!-- Liste des langues - Flex wrap compact -->
  <ng-container *ngIf="(profile?.languages || []).length > 0; else noLanguages">
    <div class="flex flex-wrap gap-2">
      <div
        *ngFor="
          let item of showAll
            ? profile?.languages
            : (profile?.languages || [] | slice: 0 : 6)
        "
        class="relative group"
      >
        <!-- Card compacte avec popup -->
        <app-candidate-language-list-item
          [item]="item"
        ></app-candidate-language-list-item>

        <!-- Boutons d'action minimalistes en overlay -->
        <div
          class="absolute -top-1.5 -right-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex gap-0.5 z-20"
        >
          <!-- Bouton Edit -->
          <span
            (click)="updateItem(item); $event.stopPropagation()"
            class="h-5 w-5 rounded-full bg-white shadow-lg border border-gray-300 flex items-center justify-center text-gray-600 hover:text-primary hover:border-primary hover:scale-110 transition-all duration-150"
            [attr.aria-label]="t('common.edit') || 'Modifier'"
          >
            <i class="fa fa-pen text-[10px]"></i>
          </span>

          <!-- Wrapper pour le bouton Delete -->
          <div
            class="h-5 w-5 rounded-full bg-white shadow-lg border border-gray-300 flex items-center justify-center hover:border-red-400 hover:scale-110 transition-all duration-150"
          >
            <app-generic-delete-item-button
              [item]="item"
              [isXLarge]="false"
              [service]="service"
              [moduleName]="moduleName"
              methodName="deleteInfos"
              [extractId]="getItemId"
              [buildPayload]="buildDeletePayload"
              [extractLabel]="getItemLabel"
              (onDone)="handleDone()"
              class="flex items-center justify-center"
            ></app-generic-delete-item-button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bouton Voir plus / Voir moins -->
    <div *ngIf="(profile?.languages?.length || 0) > 6" class="mt-4 text-center">
      <button
        (click)="toggleShowAll()"
        class="text-primary text-sm font-medium hover:underline inline-flex items-center gap-1.5"
      >
        <span>{{
          showAll
            ? t("candidateDetails.showLess") || "Voir moins"
            : t("candidateDetails.showMore") || "Voir plus"
        }}</span>
        <i
          class="fa text-xs transition-transform duration-200"
          [ngClass]="showAll ? 'fa-chevron-up' : 'fa-chevron-down'"
        ></i>
      </button>
    </div>
  </ng-container>

  <!-- État vide - Aucune langue -->
  <ng-template #noLanguages>
    <div class="w-full py-8 px-4 text-center">
      <div class="flex flex-col items-center gap-3">
        <div
          class="h-16 w-16 bg-gray-100 rounded-full flex items-center justify-center"
        >
          <i class="fa fa-language text-2xl text-primary"></i>
        </div>
        <h4 class="text-base font-semibold text-gray-900">
          {{
            t("profilePage.languages.noLanguages") || "Aucune langue ajoutée"
          }}
        </h4>
        <p class="text-sm text-gray-600">
          {{
            t("profilePage.languages.addYourFirstLanguage") ||
              "Ajoutez votre première langue"
          }}
        </p>
        <span
          (click)="addItem()"
          class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:bg-blue-700 transition-colors mt-2"
          [attr.aria-label]="t('profilePage.languages.addFirstLanguage')"
        >
          <i class="fa fa-plus text-sm mr-2"></i>
          <span>{{
            t("profilePage.languages.addFirstLanguage") || "Ajouter une langue"
          }}</span>
        </span>
      </div>
    </div>
  </ng-template>
</div>

<!-- Formulaire modal -->
<ng-template #form>
  <div class="w-full max-w-3xl">
    <app-generic-form
      [defaultValues]="defaultValues"
      [fieldConfigurations]="formConfig"
      [isLoading]="isLoading"
      [showActionButton]="false"
      transationNamespace="candidates"
      (submitForm)="onSubmit($event)"
    />

    <app-generic-error
      *ngIf="hasError"
      [message]="errorMessage"
      class="mt-4"
    ></app-generic-error>
  </div>
</ng-template>
