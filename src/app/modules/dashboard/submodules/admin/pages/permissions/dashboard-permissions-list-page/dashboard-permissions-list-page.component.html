<div class="flex flex-col w-full" *transloco="let t; read: 'permissions'">
  <!-- Header Section -->
  <div class="flex flex-col gap-3 justify-between items-start mb-6 pb-5">
    <div class="flex w-full justify-between items-center">
      <div>
        <h1 class="text-3xl pb-2 font-bold text-primary">
          {{ t("list.title") }}
        </h1>
        <p class="text-gray-600 text-sm font-normal">
          {{ t("list.description") }}
        </p>
      </div>
      <button
        [routerLink]="['../create']"
        class="bg-primary text-white rounded-lg font-semibold shadow-md hover:bg-blue-700 transition-all duration-200 flex items-center justify-center gap-2 w-10 h-10 sm:w-auto sm:h-auto sm:px-6 sm:py-3"
      >
        <i class="fas fa-plus"></i>
        <span class="hidden sm:inline">{{ t("actions.create") }}</span>
      </button>
    </div>
  </div>

  <div class="mx-0 lg:mx-0 pb-8">
    <!-- Filters Section -->
    <div
      class="flex flex-col md:flex-row flex-wrap gap-3 items-end mb-7 w-full justify-between"
    >
      <!-- Période - Date de début et fin -->
      <div class="flex w-full gap-3 md:max-w-[650px]">
        <!-- Date de début -->
        <div class="flex flex-col w-full sm:w-1/2">
          <label
            class="text-sm text-gray-700 mb-2 outline-none flex items-center gap-1"
            for="startDate"
          >
            <i class="fas fa-calendar-alt text-gray-500"></i>
            {{ t("form.startDate") }}
          </label>
          <input
            (change)="onSearch()"
            [(ngModel)]="startDate"
            class="w-full border border-gray-300 outline-none rounded-[5px] px-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
            id="startDate"
            name="startDate"
            type="date"
          />
        </div>

        <!-- Date de fin -->
        <div class="flex flex-col w-full sm:w-1/2">
          <label
            class="text-sm text-gray-700 mb-2 outline-none flex items-center gap-1"
            for="endDate"
          >
            <i class="fas fa-calendar-alt text-gray-500"></i>
            {{ t("form.endDate") }}
          </label>
          <input
            (change)="onSearch()"
            [(ngModel)]="endDate"
            class="w-full border border-gray-300 outline-none rounded-[5px] px-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
            id="endDate"
            name="endDate"
            type="date"
          />
        </div>
      </div>

      <!-- Filtres par catégories -->
      <div class="flex flex-col md:flex-row gap-3 w-full md:w-fit">
        <!-- Filtre par Ressource -->
        <div class="w-full md:w-fit">
          <label
            class="text-sm text-gray-700 mb-2 flex items-center gap-1"
            for="resource"
          >
            <i class="fas fa-layer-group text-gray-500"></i>
            {{ t("form.resource") }}
          </label>
          <div class="relative w-full md:max-w-[200px] min-w-[150px] h-[40px]">
            <select
              (change)="onSearch()"
              [(ngModel)]="resource"
              class="appearance-none w-full h-full bg-white border border-gray-300 outline-none rounded px-4 py-2 pr-8 text-sm shadow-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all"
              id="resource"
            >
              <option value="">{{ t("form.allResources") }}</option>
              <option value="USERS">{{ t("resources.USERS") }}</option>
              <option value="CANDIDATES">
                {{ t("resources.CANDIDATES") }}
              </option>
              <option value="RECRUITERS">
                {{ t("resources.RECRUITERS") }}
              </option>
              <option value="COMPANIES">{{ t("resources.COMPANIES") }}</option>
              <option value="JOB_OFFERS">
                {{ t("resources.JOB_OFFERS") }}
              </option>
              <option value="APPLICATIONS">
                {{ t("resources.APPLICATIONS") }}
              </option>
              <option value="INTERVIEWS">
                {{ t("resources.INTERVIEWS") }}
              </option>
              <option value="JOB_CATEGORIES">
                {{ t("resources.JOB_CATEGORIES") }}
              </option>
              <option value="PLATFORM_SETTINGS">
                {{ t("resources.PLATFORM_SETTINGS") }}
              </option>
              <option value="REPORTS">{{ t("resources.REPORTS") }}</option>
              <option value="LOGS">{{ t("resources.LOGS") }}</option>
              <option value="FILES">{{ t("resources.FILES") }}</option>
            </select>
            <div
              class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500"
            >
              <i class="fas fa-chevron-down"></i>
            </div>
          </div>
        </div>

        <!-- Filtre par Action -->
        <div class="w-full md:w-fit">
          <label
            class="text-sm text-gray-700 mb-2 flex items-center gap-1"
            for="action"
          >
            <i class="fas fa-cog text-gray-500"></i>
            {{ t("form.action") }}
          </label>
          <div class="relative w-full md:max-w-[200px] min-w-[150px] h-[40px]">
            <select
              (change)="onSearch()"
              [(ngModel)]="action"
              class="appearance-none w-full h-full bg-white border border-gray-300 outline-none rounded px-4 py-2 pr-8 text-sm shadow-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all"
              id="action"
            >
              <option value="">{{ t("form.allActions") }}</option>
              <option value="CREATE">{{ t("actions.CREATE") }}</option>
              <option value="READ">{{ t("actions.READ") }}</option>
              <option value="UPDATE">{{ t("actions.UPDATE") }}</option>
              <option value="DELETE">{{ t("actions.DELETE") }}</option>
              <option value="MANAGE">{{ t("actions.MANAGE") }}</option>
            </select>
            <div
              class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500"
            >
              <i class="fas fa-chevron-down"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Barre de recherche -->
      <div class="flex flex-col gap-2 w-full md:flex-row md:w-fit">
        <div class="relative flex-grow">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 py-2">
            <i class="fas fa-search text-gray-400"></i>
          </span>
          <input
            (keyup.enter)="onSearch()"
            [(ngModel)]="keyword"
            class="h-10 w-full border border-gray-300 outline-none rounded-[5px] pl-10 pr-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
            id="search"
            placeholder="{{ t('form.searchPlaceholder') }}"
            type="text"
          />
        </div>
        <button
          (click)="onSearch()"
          class="bg-[#1D9BED] text-white w-fit h-full lg:w-auto px-8 py-2 rounded-[5px] text-sm shadow transition-all duration-200 flex items-center gap-2 hover:bg-[#1585d1] transition-colors"
        >
          <i class="fas fa-search"></i>
          {{ t("form.search") }}
        </button>

        <!-- Bouton de réinitialisation des filtres -->
        <button
          (click)="onReset()"
          class="bg-gray-500 text-white w-fit h-full lg:w-auto px-6 py-2 rounded-[5px] text-sm shadow transition-all duration-200 flex items-center gap-2 hover:bg-gray-600 transition-colors"
          title="{{ t('form.resetFilters') }}"
        >
          <i class="fas fa-undo"></i>
          {{ t("form.reset") }}
        </button>
      </div>
    </div>

    <div *ngIf="isLoading" class="grid grid-rows-[1fr] h-[400px]">
      <div class="w-full text-center h-full">
        <app-loader></app-loader>
      </div>
    </div>

    <div *ngIf="!isLoading && hasError" class="w-full">
      <app-generic-error
        *ngIf="hasError"
        [message]="errorMessage"
      ></app-generic-error>
    </div>

    <div *ngIf="!isLoading && !hasError" class="max-w-full w-full">
      <app-permissions-datatable
        (create)="handleCreate()"
        (delete)="handleDelete($event)"
        (update)="handleUpdate($event)"
        (view)="handleView($event)"
        [hasError]="false"
        [isLoading]="false"
        [items]="items"
      ></app-permissions-datatable>
    </div>

    <div class="flex justify-end mb-4">
      <app-generic-paginator
        (pageChange)="onPageChange($event)"
        [currentPage]="page"
        [maxVisible]="5"
        [totalPages]="totalPages"
      ></app-generic-paginator>
    </div>
  </div>

  <!-- Error Component -->
  <app-generic-error
    *ngIf="hasError"
    [message]="errorMessage"
  ></app-generic-error>
</div>
