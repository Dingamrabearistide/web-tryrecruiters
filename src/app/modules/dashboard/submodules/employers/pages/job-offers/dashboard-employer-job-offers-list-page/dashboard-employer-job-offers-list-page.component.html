<!-- Republish modal template — must be outside *transloco to keep its bindings when rendered in the dialog -->
<ng-template #republishTpl>
  <p class="text-sm text-gray-600 mb-4">{{ republishModalMessage }}</p>
  <label class="block text-xs font-medium text-gray-600 mb-1">{{ "joboffers.republish.expiresAtLabel" | transloco }}</label>
  <input type="date" [min]="republishMinDate" [(ngModel)]="republishExpiresAt"
    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary" />
  <p class="text-xs text-gray-400 mt-1">{{ "joboffers.republish.expiresAtHint" | transloco }}</p>
  <div class="flex justify-end gap-2 pt-4">
    <button
      (click)="cancelRepublish()"
      [disabled]="republishIsLoading"
      class="px-4 py-2 font-medium rounded-md shadow-sm transition bg-gray-200 hover:bg-gray-300 text-gray-800 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ "general.cancel" | transloco }}
    </button>
    <button
      (click)="confirmRepublish()"
      [disabled]="republishIsLoading"
      class="px-4 py-2 font-medium rounded-md shadow-sm transition app-primary disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <span *ngIf="!republishIsLoading">{{ "joboffers.republish.confirm" | transloco }}</span>
      <span *ngIf="republishIsLoading" class="flex items-center justify-center w-5 h-5 mx-auto">
        <span class="animate-spin rounded-full h-5 w-5 border-2 border-transparent border-t-white block"></span>
      </span>
    </button>
  </div>
</ng-template>

<div class="flex flex-col w-full" *transloco="let t; read: 'joboffers'">

  <!-- Header Section -->
  <div class="flex flex-col gap-3 justify-between items-start mb-4">
    <div class="flex w-full justify-between items-center">
      <div>
        <h1 class="text-3xl pb-2 font-bold text-primary">
          {{ t("list.title") }}
        </h1>
        <p class="text-gray-600 text-sm font-normal">
          {{ t("list.description") }}
        </p>
      </div>
      <div>
        <button
          (click)="handleCreate()"
          class="bg-primary text-white rounded-lg font-semibold shadow-md transition-all duration-200 flex items-center justify-center gap-2 hover:opacity-90 hover:shadow-lg hover:scale-105 w-10 h-10 sm:w-auto sm:h-auto sm:px-6 sm:py-3"
        >
          <i class="fas fa-plus"></i>
          <span class="hidden sm:inline">{{ t("form.jobOffer") }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="mx-0 lg:mx-0 pb-5">
    <!-- Filters Section -->
    <div class="flex flex-col md:flex-row flex-wrap gap-3 items-end mb-7 w-full">

      <!-- Start date -->
      <div class="flex flex-col w-full md:max-w-[160px] min-w-[140px]">
        <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="startDate">
          <i class="fas fa-calendar-alt text-gray-500"></i>
          {{ t("form.startDate") }}
        </label>
        <input
          type="date"
          id="startDate"
          [(ngModel)]="startDate"
          (change)="onSearch()"
          class="h-[40px] w-full border border-gray-300 outline-none rounded-[5px] px-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
        />
      </div>

      <!-- End date -->
      <div class="flex flex-col w-full md:max-w-[160px] min-w-[140px]">
        <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="endDate">
          <i class="fas fa-calendar-check text-gray-500"></i>
          {{ t("form.endDate") }}
        </label>
        <input
          type="date"
          id="endDate"
          [(ngModel)]="endDate"
          (change)="onSearch()"
          class="h-[40px] w-full border border-gray-300 outline-none rounded-[5px] px-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
        />
      </div>

      <!-- Company -->
      <div class="flex flex-col w-full md:max-w-[200px] min-w-[160px]">
        <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="companyId">
          <i class="fas fa-building text-gray-500"></i>
          {{ t("form.company") }}
        </label>
        <div class="relative h-[40px]">
          <select
            id="companyId"
            [(ngModel)]="companyId"
            (change)="onSearch()"
            class="appearance-none w-full h-full bg-white border border-gray-300 outline-none rounded px-4 py-2 pr-8 text-sm shadow-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          >
            <option value="">{{ t("form.allCompanies") }}</option>
            <option *ngFor="let c of companies" [value]="c.id">{{ c.name }}</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500">
            <i class="fas fa-chevron-down"></i>
          </div>
        </div>
      </div>

      <!-- Contract Type -->
      <div class="flex flex-col w-full md:max-w-[200px] min-w-[160px]">
        <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="contractType">
          <i class="fas fa-briefcase text-gray-500"></i>
          {{ t("form.contractType") }}
        </label>
        <div class="relative h-[40px]">
          <select
            id="contractType"
            [(ngModel)]="contractType"
            (change)="onSearch()"
            class="appearance-none w-full h-full bg-white border border-gray-300 outline-none rounded px-4 py-2 pr-8 text-sm shadow-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          >
            <option value="">{{ t("form.allTypes") }}</option>
            <option value="FULL_TIME">{{ t("contractType.FULL_TIME") }}</option>
            <option value="PART_TIME">{{ t("contractType.PART_TIME") }}</option>
            <option value="TEMPORARY">{{ t("contractType.TEMPORARY") }}</option>
            <option value="FREELANCE">{{ t("contractType.FREELANCE") }}</option>
            <option value="INTERNSHIP">{{ t("contractType.INTERNSHIP") }}</option>
            <option value="CONTRACT">{{ t("contractType.CONTRACT") }}</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500">
            <i class="fas fa-chevron-down"></i>
          </div>
        </div>
      </div>

      <!-- Job Type -->
      <div class="flex flex-col w-full md:max-w-[200px] min-w-[160px]">
        <label class="text-sm text-gray-700 mb-2 flex items-center gap-1" for="jobType">
          <i class="fas fa-laptop-house text-gray-500"></i>
          {{ t("form.jobType") }}
        </label>
        <div class="relative h-[40px]">
          <select
            id="jobType"
            [(ngModel)]="jobType"
            (change)="onSearch()"
            class="appearance-none w-full h-full bg-white border border-gray-300 outline-none rounded px-4 py-2 pr-8 text-sm shadow-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all"
          >
            <option value="">{{ t("form.allTypes") }}</option>
            <option value="REMOTE">{{ t("jobType.REMOTE") }}</option>
            <option value="ONSITE">{{ t("jobType.ONSITE") }}</option>
            <option value="HYBRID">{{ t("jobType.HYBRID") }}</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500">
            <i class="fas fa-chevron-down"></i>
          </div>
        </div>
      </div>

      <!-- Search -->
      <div class="relative flex-1 max-w-[280px] min-w-[180px] h-[40px]">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
          <i class="fas fa-search text-gray-400"></i>
        </span>
        <input
          type="text"
          placeholder="{{ t('form.searchPlaceholder') }}"
          [(ngModel)]="keyword"
          (keyup.enter)="onSearch()"
          class="h-full w-full border border-gray-300 outline-none rounded-[5px] pl-10 pr-4 py-2 shadow-sm text-sm text-gray-700 focus:ring-2 focus:ring-primary focus:border-primary transition-all"
        />
      </div>

      <!-- Buttons -->
      <div class="flex gap-2 w-full md:w-fit h-[40px]">
        <button
          (click)="onSearch()"
          class="flex-1 md:flex-none h-full px-5 bg-blue rounded-2xl text-white text-sm font-black flex items-center justify-center gap-2 whitespace-nowrap hover:bg-blue2 transition cursor-pointer">
          <i class="fas fa-search"></i>
          {{ t("form.search") }}
        </button>
        <button
          (click)="onReset()"
          class="flex-1 md:flex-none h-full px-5 bg-gray-500 rounded-2xl text-white text-sm font-black flex items-center justify-center gap-2 whitespace-nowrap hover:bg-gray-600 transition cursor-pointer">
          <i class="fas fa-times"></i>
          {{ t("form.reset") }}
        </button>
      </div>
    </div>
    <div *ngIf="isLoading" class="grid grid-rows-[1fr] h-[400px]">
      <div class="w-full text-center h-full">
        <app-loader></app-loader>
      </div>
    </div>

    <div *ngIf="!isLoading && hasError" class="w-full">
      <app-generic-error
        *ngIf="hasError"
        [message]="errorMessage"
      ></app-generic-error>
    </div>

    <div *ngIf="!isLoading && !hasError" class="max-w-full w-full">
      <app-job-offers-datatable
        [items]="items"
        [isLoading]="false"
        [hasError]="false"
        (create)="handleCreate()"
        (view)="handleView($event)"
        (update)="handleUpdate($event)"
        (delete)="handleDelete($event)"
        (republish)="handleRepublish($event)"
        (submit)="submitDraft($event)"
      ></app-job-offers-datatable>
    </div>

    <div class="flex justify-end mb-4">
      <app-generic-paginator
        [currentPage]="page"
        [totalPages]="totalPages"
        [maxVisible]="5"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)"
      ></app-generic-paginator>
    </div>
  </div>

  <app-generic-error
    *ngIf="hasError"
    [message]="errorMessage"
  ></app-generic-error>
</div>
