      <button
        (click)="addItem()"
        class="inline-flex items-center justify-center w-9 h-9 sm:w-auto sm:h-auto sm:px-4 sm:py-2 text-sm font-medium text-white bg-primary rounded-md hover:bg-blue-700 transition-colors"
      >
        <i class="fa fa-plus text-sm sm:mr-2"></i>
        <span class="hidden sm:inline">{{ t("profilePage.experiences.addExperience") || "Ajouter" }}</span>
      </button>
    </div>
  </div>

  <ng-container
    *ngIf="(displayedExperiences || []).length > 0; else noExperience"
  >
    <div class="space-y-4">
      <div
        *ngFor="
          let item of showAll
            ? displayedExperiences
            : (displayedExperiences | slice: 0 : 3)
        "
        class="border border-gray-200 rounded-lg p-4 relative hover:border-primary transition-colors"
      >
        <div class="pr-16">
          <app-candidate-experience-list-item
            [item]="item"
          ></app-candidate-experience-list-item>
        </div>

        <div class="absolute right-4 top-4 flex gap-3 text-gray-400">
          <span
            (click)="updateItem(item)"
            class="cursor-pointer hover:text-primary transition-colors"
          >
            <i class="fa fa-edit text-lg"></i>
          </span>

          <app-generic-delete-item-button
            [item]="item"
            [service]="service"
            [moduleName]="moduleName"
            methodName="deleteInfos"
            [extractId]="getItemId"
            [buildPayload]="buildDeletePayload"
            [extractLabel]="getItemLabel"
            (onDone)="handleDone()"
          ></app-generic-delete-item-button>
        </div>
      </div>
    </div>

    <div
      *ngIf="(profile?.experiences?.length || 0) > 3"
      class="mt-4 text-center"
    >
      <button
        (click)="toggleShowAll()"
        class="text-primary text-sm font-medium hover:underline"
      >
        {{
          showAll
            ? t("candidateDetails.showLess") || "Voir moins"
            : t("candidateDetails.showMore") || "Voir plus"
        }}
      </button>
    </div>
  </ng-container>

  <ng-template #noExperience>
    <div class="w-full py-12 px-4 text-center">
      <div class="flex flex-col items-center gap-4">
        <div
          class="h-20 w-20 bg-gray-100 rounded-full flex items-center justify-center"
        >
          <i class="fa fa-briefcase text-3xl text-primary"></i>
        </div>
        <h4 class="text-lg font-semibold text-gray-900">
          {{ t("profilePage.experiences.noExperience") || "Aucune expérience" }}
        </h4>
        <p class="text-sm text-gray-600">
          {{
            t("profilePage.experiences.addYourFirstExperience") ||
              "Ajoutez votre première expérience professionnelle"
          }}
        </p>
        <button
          (click)="addItem()"
          class="inline-flex items-center px-4 py-2.5 text-sm font-medium text-white bg-primary rounded-md hover:bg-blue-700 transition-colors mt-2"
        >
          <i class="fa fa-plus text-sm mr-2"></i>
          {{
            t("profilePage.experiences.addFirstExperience") ||
              "Ajouter une expérience"
          }}
        </button>
      </div>
    </div>
  </ng-template>
  <ng-template #form>
    <div class="w-full">
      <app-generic-form
        [defaultValues]="defaultValues"
        [fieldConfigurations]="formConfig"
        [isLoading]="isLoading"
        [showActionButton]="false"
        transationNamespace="candidates"
        (formReady)="onFormReady($event)"
        (submitForm)="onSubmit($event)"
      ></app-generic-form>

      <app-generic-error
        *ngIf="hasError"
        [message]="errorMessage"
        class="mt-4"
      ></app-generic-error>
    </div>
  </ng-template>
</div>
