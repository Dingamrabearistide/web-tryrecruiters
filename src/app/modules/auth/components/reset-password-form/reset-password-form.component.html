<form
  *transloco="let t; read: 'auth'"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="space-y-5"
>
  <!-- Verification Code -->
  <label class="block">
    <span class="text-sm font-black text-navy">{{
      t("resetPassword.codeLabel")
    }}</span>
    <div class="mt-3">
      <app-otp-input formControlName="code" [length]="6"></app-otp-input>
    </div>
    <app-form-field-errors
      fieldName="code"
      [control]="form.get('code')"
    ></app-form-field-errors>
  </label>

  <!-- New Password -->
  <label class="block">
    <span class="text-sm font-black text-navy">{{
      t("resetPassword.passwordLabel")
    }}</span>
    <div
      class="mt-2 flex h-13 items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 transition focus-within:border-blue focus-within:ring-4 focus-within:ring-blue/10"
    >
      <i class="fa-solid fa-lock text-blue"></i>
      <input
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        class="w-full bg-transparent text-sm font-semibold text-slate-700 outline-none"
        [placeholder]="t('resetPassword.passwordPlaceholder')"
      />
      <button
        type="button"
        (click)="showPassword = !showPassword"
        class="text-slate-400 transition hover:text-blue"
        tabindex="-1"
      >
        <i
          [class]="showPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"
        ></i>
      </button>
    </div>
    <app-form-field-errors
      fieldName="password"
      [control]="form.get('password')"
    ></app-form-field-errors>
  </label>

  <!-- Confirm Password -->
  <label class="block">
    <span class="text-sm font-black text-navy">{{
      t("resetPassword.confirmPasswordLabel")
    }}</span>
    <div
      class="mt-2 flex h-13 items-center gap-3 rounded-2xl border border-line bg-white px-4 py-3 transition focus-within:border-blue focus-within:ring-4 focus-within:ring-blue/10"
    >
      <i class="fa-solid fa-circle-check text-blue"></i>
      <input
        [type]="showConfirmPassword ? 'text' : 'password'"
        formControlName="passwordConfirmation"
        class="w-full bg-transparent text-sm font-semibold text-slate-700 outline-none"
        [placeholder]="t('resetPassword.confirmPasswordPlaceholder')"
      />
      <button
        type="button"
        (click)="showConfirmPassword = !showConfirmPassword"
        class="text-slate-400 transition hover:text-blue"
        tabindex="-1"
      >
        <i
          [class]="showConfirmPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'"
        ></i>
      </button>
    </div>
    <app-form-field-errors
      fieldName="passwordConfirmation"
      [control]="form.get('passwordConfirmation')"
    ></app-form-field-errors>
    <p
      *ngIf="form.errors?.['mismatch'] && form.touched"
      class="mt-1 text-sm text-red-500"
    >
      {{ t("resetPassword.errors.mismatch") }}
    </p>
  </label>

  <!-- Password rules -->
  <div class="rounded-[26px] bg-slate-50 p-4">
    <p class="mb-3 text-sm font-black text-navy">
      {{ t("resetPassword.rulesTitle") }}
    </p>
    <div class="grid gap-2 text-sm font-bold text-slate-600 sm:grid-cols-2">
      <p [class.text-navy]="rules.length" [class.text-slate-600]="!rules.length">
        <i
          [class]="rules.length ? 'fa-solid fa-circle-check mr-2 text-emerald-500' : 'fa-regular fa-circle mr-2 text-slate-300'"
        ></i
        >{{ t("resetPassword.ruleLength") }}
      </p>
      <p [class.text-navy]="rules.uppercase" [class.text-slate-600]="!rules.uppercase">
        <i
          [class]="rules.uppercase ? 'fa-solid fa-circle-check mr-2 text-emerald-500' : 'fa-regular fa-circle mr-2 text-slate-300'"
        ></i
        >{{ t("resetPassword.ruleUppercase") }}
      </p>
      <p [class.text-navy]="rules.number" [class.text-slate-600]="!rules.number">
        <i
          [class]="rules.number ? 'fa-solid fa-circle-check mr-2 text-emerald-500' : 'fa-regular fa-circle mr-2 text-slate-300'"
        ></i
        >{{ t("resetPassword.ruleNumber") }}
      </p>
      <p [class.text-navy]="rules.match" [class.text-slate-600]="!rules.match">
        <i
          [class]="rules.match ? 'fa-solid fa-circle-check mr-2 text-emerald-500' : 'fa-regular fa-circle mr-2 text-slate-300'"
        ></i
        >{{ t("resetPassword.ruleMatch") }}
      </p>
    </div>
  </div>

  <!-- Submit -->
  <button
    [disabled]="isLoading"
    type="submit"
    class="flex w-full items-center justify-center gap-2 rounded-2xl bg-blue px-6 py-4 text-sm font-black text-white shadow-glow transition hover:bg-blue2 disabled:cursor-not-allowed disabled:opacity-70"
  >
    <app-loader *ngIf="isLoading" [showText]="false"></app-loader>
    <span *ngIf="isLoading" class="ml-2">{{
      t("resetPassword.loading")
    }}</span>
    <span *ngIf="!isLoading"
      ><i class="fa-solid fa-floppy-disk"></i>
      {{ t("resetPassword.submitButton") }}</span
    >
  </button>
</form>
