<form
  *transloco="let t; read: 'auth'"
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="w-full space-y-5"
>
  <!-- Code Field -->
  <label class="block">
    <span class="text-sm font-black text-navy">{{ t("otp.codeLabel") }}</span>
    <div class="mt-3">
      <app-otp-input formControlName="code" [length]="6"></app-otp-input>
    </div>
    <app-form-field-errors
      fieldName="code"
      [control]="form.get('code')"
    ></app-form-field-errors>
  </label>

  <!-- Submit -->
  <button
    [disabled]="isLoading"
    type="submit"
    class="flex w-full items-center justify-center gap-2 rounded-2xl bg-blue px-6 py-4 text-sm font-black text-white shadow-glow transition hover:bg-blue2 disabled:opacity-70 disabled:cursor-not-allowed"
  >
    <app-loader *ngIf="isLoading" [showText]="false" class="text-white"></app-loader>
    <span *ngIf="isLoading" class="ml-2">{{ t("loading") }}</span>
    <span *ngIf="!isLoading">
      <i class="fa-solid fa-circle-check mr-1"></i>
      {{ t("otp.submitButton") }}
    </span>
  </button>
</form>
