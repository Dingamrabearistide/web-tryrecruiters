  <div class="mt-4">
    <app-loader *ngIf="isLoading"></app-loader>
  </div>

  <div
    *ngIf="!hasError && !isLoading"
    class="w-full mb-10 mx-auto flex flex-col xl:flex-row gap-6 text-sm text-gray-700"
  >
    <div class="w-full xl:w-3/4 inline-block align-top pr-8">
      <app-candidates-personal-info
        [profile]="profile"
        (onDone)="handleDone($event)"
      ></app-candidates-personal-info>

      <!-- Work Experience Section -->
      <app-candidates-experiences-list
        [profile]="profile"
        (onDone)="handleDone($event)"
      ></app-candidates-experiences-list>

      <app-candidates-educations-list
        [profile]="profile"
        (onDone)="handleDone($event)"
      ></app-candidates-educations-list>

      <app-candidates-certifications-list
        [profile]="profile"
        (onDone)="handleDone($event)"
      ></app-candidates-certifications-list>
    </div>

        (onDone)="handleDone($event)"
      ></app-candidates-languages-list>
